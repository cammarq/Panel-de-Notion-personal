name: Actualizar panel

on:
  schedule:
    - cron: "0 * * * *"      # cada hora, en punto (UTC)
  workflow_dispatch:          # y a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el panel desde Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python panel_notion.py

      - name: Publicar si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sin cambios en Notion, no hay nada que publicar."
          else
            git commit -m "Actualiza el panel ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
